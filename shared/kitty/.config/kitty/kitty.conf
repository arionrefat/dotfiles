# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

#Size
font_size 18.0

#Cursor
cursor_blink_interval 0
cursor_stop_blinking_after 0

# for lower cpu cycle
input_delay 3

#Mouse
copy_on_select yes
strip_trailing_spaces smart

# Terminal bell
enable_audio_bell no

#Window Layout
window_padding_width 10

#Tab Bar
tab_bar_edge top

#ColorScheme
#background_opacity 0.75
#background_blur 20

#Advanced
update_check_interval 0

#Sesssions

# Browse session files inside a directory and pick one
map f7>p goto_session ~/.config/kitty/sessions

# Browse and select from the list of known projects defined via goto_session commands
map f7>/ goto_session

# mac settings
macos_option_as_alt yes

map cmd+k no_op
map alt+cmd+k no_op
map ctrl+cmd+l no_op

hide_window_decorations titlebar-only
macos_quit_when_last_window_closed yes

macos_colorspace displayp3

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
